<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>RPG Architect Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Тема Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Сворачивание папок слева -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    :root {
      --theme-color: #2563eb;
      --sidebar-width: 300px;
      --toc-width: 240px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
    }

    /* Левый сайдбар */
    .sidebar {
      width: var(--sidebar-width);
      padding-top: 15px;
      border-right: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .sidebar .app-name-link {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .sidebar ul li a {
      font-size: 13.5px;
      color: #475569;
    }
    .sidebar ul li.active > a {
      color: var(--theme-color);
      font-weight: 600;
      border-right: 2px solid var(--theme-color);
    }
    .sidebar ul li strong {
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    /* Центральная статья */
    .content {
      padding-left: calc(var(--sidebar-width) + 20px);
    }
    .markdown-section {
      max-width: 840px;
      padding: 30px 40px 60px 20px;
      margin-right: calc(var(--toc-width) + 30px);
    }

    /* Правое оглавление статьи (TOC) */
    #right-toc {
      position: fixed;
      top: 70px;
      right: 20px;
      width: var(--toc-width);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding-left: 14px;
      border-left: 2px solid #e2e8f0;
      z-index: 100;
    }
    #right-toc .toc-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    #right-toc ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #right-toc li {
      margin: 4px 0;
    }
    #right-toc li.toc-h3 {
      padding-left: 12px;
    }
    #right-toc li.toc-h4 {
      padding-left: 22px;
    }
    #right-toc a {
      font-size: 12.5px;
      color: #64748b;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #right-toc a:hover, #right-toc a.active {
      color: var(--theme-color);
      font-weight: 600;
    }

    @media screen and (max-width: 1200px) {
      .markdown-section { margin-right: 0; max-width: 100%; }
      #right-toc { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <!-- Контейнер для правого TOC -->
  <div id="right-toc">
    <div class="toc-title">Table of contents</div>
    <ul id="right-toc-list"></ul>
  </div>

  <script>
    window.$docsify = {
      name: 'RPG Architect Docs',
      auto2top: true,
      loadSidebar: true,
      subMaxLevel: 0,
      homepage: 'README.md',
      sidebarDisplayLevel: 1,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'Not found',
        depth: 3
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      // Плагин сборки правого TOC
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            const list = document.getElementById('right-toc-list');
            const container = document.getElementById('right-toc');
            if (!list || !container) return;
            list.innerHTML = '';

            const headers = document.querySelectorAll('.markdown-section h2, .markdown-section h3, .markdown-section h4');
            if (headers.length === 0) {
              container.style.display = 'none';
              return;
            } else {
              if (window.innerWidth > 1200) container.style.display = 'block';
            }

            headers.forEach(h => {
              const id = h.getAttribute('id');
              const text = h.innerText.replace(/^[#\s]+/, '').replace(/¶$/, '').trim();
              if (!id || !text) return;

              const li = document.createElement('li');
              li.className = 'toc-' + h.tagName.toLowerCase();

              const a = document.createElement('a');
              a.href = '#' + vm.route.path + '?id=' + encodeURIComponent(id);
              a.innerText = text;

              a.addEventListener('click', e => {
                e.preventDefault();
                h.scrollIntoView({ behavior: 'smooth' });
                history.pushState(null, null, '#' + vm.route.path + '?id=' + encodeURIComponent(id));
              });

              li.appendChild(a);
              list.appendChild(li);
            });
          });
        }
      ]
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Плагины -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
